<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Продуктовый бриф</title>
<style>
  :root{
    color-scheme:light;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, "Cascadia Mono", Consolas, monospace;
    --bg:#E7E6E1;--surface:#F4F3EF;--surface-2:#FBFAF7;--line:#D5D3CB;--line-2:#C3C0B6;
    --ink:#1A1F28;--ink-2:#464D5C;--ink-3:#6E7684;
    --accent:#3450E0;--accent-2:#2038B0;--accent-soft:rgba(52,80,224,.10);--on-accent:#fff;
    --gold:#9E7412;--slate:#6C7482;--slate-soft:rgba(108,116,130,.14);
    --good:#22855B;--good-soft:rgba(34,133,91,.12);--warn:#A86C0E;--warn-soft:rgba(184,121,20,.14);--bad:#C6402D;
    --radius:13px;--radius-sm:8px;
    --shadow:0 1px 2px rgba(20,25,35,.05), 0 8px 24px -12px rgba(20,25,35,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0F1218;--surface:#171B23;--surface-2:#1E232D;--line:#282E39;--line-2:#39414F;
      --ink:#E9EBEF;--ink-2:#AEB6C4;--ink-3:#8A93A1;
      --accent:#6C86FF;--accent-2:#8AA0FF;--accent-soft:rgba(108,134,255,.15);--on-accent:#0F1218;
      --gold:#D9B457;--slate:#8B94A3;--slate-soft:rgba(139,148,163,.16);
      --good:#48C08C;--good-soft:rgba(72,192,140,.15);--warn:#E0A63C;--warn-soft:rgba(224,166,60,.16);--bad:#EB6B57;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F1218;--surface:#171B23;--surface-2:#1E232D;--line:#282E39;--line-2:#39414F;
    --ink:#E9EBEF;--ink-2:#AEB6C4;--ink-3:#8A93A1;
    --accent:#6C86FF;--accent-2:#8AA0FF;--accent-soft:rgba(108,134,255,.15);--on-accent:#0F1218;
    --gold:#D9B457;--slate:#8B94A3;--slate-soft:rgba(139,148,163,.16);
    --good:#48C08C;--good-soft:rgba(72,192,140,.15);--warn:#E0A63C;--warn-soft:rgba(224,166,60,.16);--bad:#EB6B57;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:30px 16px 90px}
  @media(min-width:700px){.wrap{padding:30px 22px 90px}}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  h1{font-size:30px;line-height:1.08;margin:7px 0 8px;letter-spacing:-.02em;text-wrap:balance;font-weight:650}
  h2{font-size:13px;font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:38px 0 4px;font-weight:600}
  .lede{color:var(--ink-2);max-width:70ch;margin:0}
  .note{font-size:13px;color:var(--ink-3);margin:4px 0 0}

  .profile{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .ptag{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}

  .callout{margin-top:22px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--surface);padding:17px 19px;box-shadow:var(--shadow)}
  .callout .lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:7px}
  .callout p{margin:0 0 9px}
  .callout p:last-child{margin-bottom:0}
  .callout .csrc{font-size:12px;color:var(--ink-3);margin-top:10px}
  .callout .csrc a{color:var(--ink-3);border-bottom:1px dotted var(--line-2)}
  .openbox{border-left-color:var(--good)}
  .openbox .lab{color:var(--good)}

  .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 4px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2)}
  .seg button{padding:7px 13px;font-size:13px;color:var(--ink-2);border:none;border-right:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-weight:500}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .seg button:not(.on):hover{background:var(--surface)}
  select.mini,.search input{padding:8px 11px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:13px}
  .search{flex:1;min-width:150px}
  .search input{width:100%}
  label.tg{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  label.tg input{accent-color:var(--accent);width:15px;height:15px}
  .count{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-left:auto}

  .cards{display:flex;flex-direction:column;gap:14px;margin-top:16px}
  .card{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px 18px 16px 22px;box-shadow:var(--shadow);overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--slate)}
  .card.t1::before{background:var(--gold)} .card.t2::before{background:var(--accent)} .card.t3::before{background:var(--slate)}
  .chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rank{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);font-weight:600}
  .cname{font-size:19px;font-weight:650;letter-spacing:-.01em}
  .cname a{color:var(--ink)}
  .cname a:hover{color:var(--accent)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:550;font-family:var(--font-mono);letter-spacing:.02em}
  .chip.tier{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
  .chip.dom{background:var(--accent-soft);color:var(--accent)}
  .chip.stage{background:var(--slate-soft);color:var(--ink-2)}
  .chip.open{background:var(--good-soft);color:var(--good)}
  .chip.flagchip{background:var(--warn-soft);color:var(--warn)}

  .why{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .why li{position:relative;padding-left:18px;color:var(--ink-2);font-size:14px}
  .why li::before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:600}

  .crow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .who{font-size:13.5px;color:var(--ink)}
  .who b{font-weight:650}
  .who .role{color:var(--ink-3)}
  .vbadge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:7px}
  .vbadge.ok{background:var(--good-soft);color:var(--good)} .vbadge.no{background:var(--warn-soft);color:var(--warn)}
  .channels{display:flex;gap:6px;flex-wrap:wrap}
  .ch{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);font-size:12.5px;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
  .ch:hover{border-color:var(--accent);text-decoration:none;color:var(--accent)}
  .ch svg{width:13px;height:13px;flex:none}
  .ch.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .ch.prim:hover{background:var(--accent-2);color:var(--on-accent)}
  .ch.unv{border-style:dashed}

  .cfoot{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .conf{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
  .cdot{width:8px;height:8px;border-radius:50%}
  .cdot.high{background:var(--good)} .cdot.medium{background:var(--warn)} .cdot.low{background:var(--slate)}
  .srcs{font-size:12px;color:var(--ink-3)}
  .srcs a{color:var(--ink-3);border-bottom:1px dotted var(--line-2)}
  .srcs a:hover{color:var(--accent)}
  .flagnote{margin-top:11px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:var(--radius-sm);padding:8px 11px;line-height:1.45}

  .block{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:4px;box-shadow:var(--shadow);margin-top:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th,td{text-align:left;padding:10px 14px;font-size:13.5px;vertical-align:top}
  th{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:none}
  td.date{font-family:var(--font-mono);font-size:12px;white-space:nowrap;color:var(--ink-2)}
  .empty{padding:22px;text-align:center;color:var(--ink-3);font-size:13.5px}

  .steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .stp{display:flex;gap:13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:12px 15px}
  .stp .n{counter-increment:s;font-family:var(--font-mono);color:var(--accent);font-weight:600;font-size:13px;min-width:22px}
  .stp .n::before{content:counter(s,decimal-leading-zero)}
  .stp b{font-weight:650}
  .stp p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}

  .tmpl{margin-top:12px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface-2);padding:16px 18px}
  .tmpl .lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tmpl .msg{font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
  .tmpl .var{background:var(--accent-soft);color:var(--accent);padding:0 4px;border-radius:4px;font-family:var(--font-mono);font-size:12.5px}
  .copybtn{font-family:var(--font-sans);font-size:12px;color:var(--accent);background:none;border:1px solid var(--line-2);border-radius:6px;padding:4px 10px;cursor:pointer;text-transform:none;letter-spacing:0}
  .copybtn:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

  .flags{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  @media(max-width:640px){.flags{grid-template-columns:1fr}}
  .flag{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--radius-sm);background:var(--surface);padding:11px 14px;font-size:13px;color:var(--ink-2)}
  .flag b{color:var(--ink)}

  .foot{margin-top:34px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);line-height:1.6;border-top:1px solid var(--line);padding-top:16px;white-space:pre-line}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";
  // Данные подставляет scripts/build_brief.py — руками не править.
  var D = /*__BRIEF_DATA__*/null;
  var app = document.getElementById("app");

  if(!D){
    app.innerHTML = '<p class="empty">Шаблон без данных. Собери бриф: python3 scripts/build_brief.py brief-data.json brief.html</p>';
    return;
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function rich(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
  function url(u){ u = String(u || ""); return /^(https?:\/\/|mailto:)/i.test(u) ? esc(u) : "#"; }
  function a(u, label, cls){
    return '<a' + (cls ? ' class="' + cls + '"' : '') + ' href="' + url(u) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
  }
  function arr(x){ return Array.isArray(x) ? x : []; }
  function fmtDate(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
    return m ? m[3] + "." + m[2] + "." + m[1] : esc(s);
  }

  var ICONS = {
    linkedin:'<path d="M4 4h16v16H4z"/><path d="M8 10v6M8 7.5v.01M12 16v-3.5a2 2 0 014 0V16M12 16v-6"/>',
    tg:'<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/>',
    email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/>',
    form:'<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>'
  };
  function icon(t){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[t] || ICONS.web) + '</svg>';
  }

  var C = arr(D.companies);
  var h = "";

  // Шапка
  h += '<div class="eyebrow">PM Job Search · ' + esc(D.market || "") + ' · Бриф-досье · ' + fmtDate(D.date) + '</div>';
  h += '<h1>' + esc(D.title) + '</h1>';
  if(D.lede) h += '<p class="lede">' + rich(D.lede) + '</p>';
  if(arr(D.profileTags).length){
    h += '<div class="profile">' + D.profileTags.map(function(t){ return '<span class="ptag">' + esc(t) + '</span>'; }).join("") + '</div>';
  }

  // Главный вывод рынка
  if(D.insight){
    h += '<div class="callout"><div class="lab">' + esc(D.insight.title || "Главный вывод рынка") + ' · ' + fmtDate(D.date) + '</div>';
    h += arr(D.insight.paragraphs).map(function(p){ return '<p>' + rich(p) + '</p>'; }).join("");
    if(arr(D.insight.sources).length){
      h += '<div class="csrc">Источники: ' + D.insight.sources.map(function(s){ return a(s[1], esc(s[0])); }).join(" · ") + '</div>';
    }
    h += '</div>';
  }
  if(D.highlight){
    h += '<div class="callout openbox"><div class="lab">✅ ' + esc(D.highlight.title || "Лучшая открытая роль") + '</div><p>' + rich(D.highlight.text) + '</p></div>';
  }

  // Открытые роли
  h += '<h2>Открытые роли — можно откликаться прямо сейчас</h2>';
  h += '<p class="note">Срез на ' + fmtDate(D.date) + '. Меняется быстро — открой ссылку и проверь актуальность перед откликом.</p>';
  var roles = arr(D.openRoles);
  h += '<div class="block">';
  if(roles.length){
    h += '<table><thead><tr><th>Компания</th><th>Роль · формат</th><th>Домен</th><th>Опубликована</th><th>Ссылка</th><th>Заметка</th></tr></thead><tbody>';
    roles.forEach(function(r){
      h += '<tr><td><b>' + esc(r.company) + '</b></td><td>' + esc(r.role) + '</td><td>' + esc(r.domain) + '</td><td class="date">' + fmtDate(r.posted) + '</td><td>' + a(r.url, esc(r.linkLabel || "открыть")) + '</td><td>' + esc(r.note) + '</td></tr>';
    });
    h += '</tbody></table>';
  } else {
    h += '<div class="empty">Подходящих открытых ролей в этот срез не нашлось — работаем через целевые компании ниже.</div>';
  }
  h += '</div>';
  var watch = arr(D.alsoWatching);
  if(watch.length || D.skipNote){
    h += '<p class="note" style="margin-top:9px">';
    if(watch.length) h += 'Ранние стартапы, которые набирают команду без оформленной PM-роли (заход к фаундеру): ' + watch.map(function(w){ return a(w.url, esc(w.name)); }).join(" · ") + '. ';
    if(D.skipNote) h += esc(D.skipNote);
    h += '</p>';
  }

  // Компании
  h += '<h2>Полный список целей — тиры, «почему тебе», на кого выходить</h2>';
  h += '<div class="toolbar"><div class="seg" id="tierSeg"><button data-tier="all" class="on">Все тиры</button><button data-tier="1">Тир 1</button><button data-tier="2">Тир 2</button><button data-tier="3">Тир 3</button></div>';
  h += '<select class="mini" id="domSel" aria-label="Домен"><option value="all">Все домены</option></select>';
  h += '<label class="tg"><input type="checkbox" id="openOnly"> Только с открытой ролью</label>';
  h += '<div class="search"><input type="text" id="search" placeholder="Поиск по названию…" aria-label="Поиск по названию"></div>';
  h += '<span class="count" id="count"></span></div>';
  h += '<div class="cards" id="cards"></div>';

  // Каналы
  var chs = arr(D.channels), tgs = arr(D.tgChannels), bases = arr(D.bases);
  if(chs.length || tgs.length || bases.length){
    h += '<h2>Каналы, где мониторить и откликаться</h2>';
    if(chs.length){
      h += '<div class="block"><table><thead><tr><th>Ресурс</th><th>Ссылка</th><th>Как пользоваться</th></tr></thead><tbody>';
      chs.forEach(function(c){ h += '<tr><td>' + esc(c.name) + '</td><td>' + a(c.url, "открыть") + '</td><td>' + esc(c.how) + '</td></tr>'; });
      h += '</tbody></table></div>';
    }
    if(tgs.length){
      h += '<div class="block"><table><thead><tr><th>Telegram-канал</th><th>Хендл</th><th>Профиль</th></tr></thead><tbody>';
      tgs.forEach(function(c){ h += '<tr><td>' + esc(c.name) + '</td><td>' + a(c.url, esc(c.handle)) + '</td><td>' + esc(c.profile) + '</td></tr>'; });
      h += '</tbody></table></div>';
    }
    if(bases.length){
      h += '<p class="note" style="margin-top:10px">Базы для проактивного поиска целей: ' + bases.map(function(b){ return a(b.url, esc(b.name)) + (b.note ? ' (' + esc(b.note) + ')' : ''); }).join(" · ") + '. ' + esc(D.basesNote || "") + '</p>';
    }
  }

  // Шаги
  var steps = arr(D.steps);
  if(steps.length){
    h += '<h2>Как выйти на ЛПР</h2><div class="steps">';
    steps.forEach(function(s){ h += '<div class="stp"><span class="n"></span><div><b>' + esc(s.title) + '</b><p>' + esc(s.text) + '</p></div></div>'; });
    h += '</div>';
  }

  // Шаблон письма
  if(D.outreach){
    h += '<div class="tmpl"><div class="lab"><span>Шаблон сообщения (под тебя)</span><button class="copybtn" id="copyTmpl" type="button">Копировать</button></div>';
    h += '<div class="msg" id="tmplMsg">' + esc(D.outreach).replace(/\[([^\]]+)\]/g, '<span class="var">[$1]</span>') + '</div></div>';
  }

  // Флаги
  var flags = arr(D.flags);
  if(flags.length){
    h += '<h2>Флаги достоверности — проверь перед питчем</h2><div class="flags">';
    flags.forEach(function(f){ h += '<div class="flag"><b>' + esc(f.subject) + ':</b> ' + esc(f.text) + '</div>'; });
    h += '</div>';
  }

  // Исключённые
  var ex = arr(D.excluded);
  if(ex.length){
    h += '<p class="note" style="margin-top:18px">Исключены: ' + ex.map(function(e){ return '<b>' + esc(e.name) + '</b> — ' + esc(e.reason); }).join("; ") + '.</p>';
  }

  if(D.footer) h += '<div class="foot">' + esc(D.footer) + '</div>';

  app.innerHTML = h;
  document.title = D.title || "Продуктовый бриф";

  // Карточки и фильтры
  var doms = {};
  C.forEach(function(c){ arr(c.domains).forEach(function(d){ doms[d] = 1; }); });
  var sel = document.getElementById("domSel");
  Object.keys(doms).sort().forEach(function(d){
    var o = document.createElement("option"); o.value = d; o.textContent = d; sel.appendChild(o);
  });

  var state = {tier:"all", dom:"all", open:false, q:""};
  var V_OK = '<span class="vbadge ok">✓ проверено</span>', V_NO = '<span class="vbadge no">перепроверить</span>';

  function card(c, i){
    var chips = '<span class="chip tier">Тир ' + esc(c.tier) + '</span>';
    arr(c.domains).forEach(function(d){ chips += '<span class="chip dom">' + esc(d) + '</span>'; });
    if(c.stage) chips += '<span class="chip stage">' + esc(c.stage) + '</span>';
    if(c.open) chips += '<span class="chip open">● ' + (c.open.url ? a(c.open.url, esc(c.open.text)).replace('<a ', '<a style="color:inherit" ') : esc(c.open.text)) + '</span>';
    if(c.flag) chips += '<span class="chip flagchip">⚑ флаг</span>';
    var why = arr(c.why).map(function(w){ return '<li>' + esc(w) + '</li>'; }).join("");
    var chans = arr(c.channels).map(function(x){
      var cls = "ch" + (x.primary ? " prim" : "") + (x.verified === false ? " unv" : "");
      return a(x.url, icon(x.type) + esc(x.label), cls);
    }).join("");
    var who = c.who ? '<span class="who"><b>' + esc(c.who.name) + '</b> <span class="role">· ' + esc(c.who.role) + '</span>' + (c.who.verified ? V_OK : V_NO) + '</span>' : '';
    var srcs = arr(c.sources).map(function(s){ return a(s[1], esc(s[0])); }).join(" · ");
    var conf = ["high","medium","low"].indexOf(c.confidence) >= 0 ? c.confidence : "low";
    return '<div class="card t' + esc(c.tier) + '">' +
      '<div class="chead"><span class="rank">' + i + '</span>' +
      '<span class="cname">' + (c.site ? a(c.site, esc(c.name)) : esc(c.name)) + '</span>' +
      '<span class="chips">' + chips + '</span></div>' +
      (why ? '<ul class="why">' + why + '</ul>' : '') +
      '<div class="crow">' + who + '<span class="channels">' + chans + '</span></div>' +
      (c.flag ? '<div class="flagnote"><b>⚑</b> ' + esc(c.flag) + '</div>' : '') +
      '<div class="cfoot"><span class="conf"><span class="cdot ' + conf + '"></span>уверенность: ' + conf + '</span>' +
      (srcs ? '<span class="srcs">Источники: ' + srcs + '</span>' : '') + '</div>' +
      '</div>';
  }

  function render(){
    var n = 0, out = "";
    C.forEach(function(c){
      if(state.tier !== "all" && String(c.tier) !== state.tier) return;
      if(state.dom !== "all" && arr(c.domains).indexOf(state.dom) < 0) return;
      if(state.open && !c.open) return;
      if(state.q && String(c.name || "").toLowerCase().indexOf(state.q) < 0) return;
      n++; out += card(c, n);
    });
    document.getElementById("cards").innerHTML = out || '<div class="empty">Ничего не найдено под фильтр.</div>';
    document.getElementById("count").textContent = n + " из " + C.length;
  }

  document.getElementById("tierSeg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.tier = b.getAttribute("data-tier");
    this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
    render();
  });
  sel.addEventListener("change", function(e){ state.dom = e.target.value; render(); });
  document.getElementById("openOnly").addEventListener("change", function(e){ state.open = e.target.checked; render(); });
  document.getElementById("search").addEventListener("input", function(e){ state.q = e.target.value.toLowerCase(); render(); });

  var copy = document.getElementById("copyTmpl");
  if(copy){
    copy.addEventListener("click", function(){
      var t = document.getElementById("tmplMsg").innerText, btn = this;
      function done(ok){ btn.textContent = ok ? "Скопировано ✓" : "Выдели и скопируй"; setTimeout(function(){ btn.textContent = "Копировать"; }, 1600); }
      try { navigator.clipboard.writeText(t).then(function(){ done(true); }, function(){ done(false); }); }
      catch(err){ done(false); }
    });
  }

  render();
})();
</script>
</body>
</html>
